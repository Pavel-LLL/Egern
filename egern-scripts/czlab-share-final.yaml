# czlab 兑换码每日分享 —— Egern 模块
#
# 安装步骤：
#   1. 把 czlab_share.egern.js 和本文件一起上传到你的 GitHub 仓库 egern-scripts
#      （仓库 → Add file → Upload files → Commit changes）
#   2. 点开本文件 → Raw → 复制地址栏 URL
#   3. Egern → Tools → Modules → + → 粘贴 URL → 添加
#   4. 点进模块 → 设置 → 填写 CZLAB_CODE（你的 6 位 Muse 兑换码）
#   5. 每小时整点自动运行：静默记录兑换码是否在前十曝光及名次；
#      每天 20:00（CZLAB_REPORT_HOUR 可改）做提交检查并推送汇总
#
# 说明：兑换码仅在池中公开展示 24 小时；站内展示顺序每小时重排，
# 每小时检查一次可完整统计曝光情况，码掉出池子时 20:00 自动补交。
#
# 更新日志：
#   2026-10-15 cron 从每天 20:00 改为每小时整点；script_url 更新为新仓库地址。
# Egern 的 JS 运行时与 QX/Surge 不兼容，本脚本按 Egern 官方 API
#（export default async function(ctx)，ctx.http / ctx.storage / ctx.notify）编写。

name: czlab 兑换码每小时分享
description: 每小时检查你的 Muse 兑换码在 code.czlab.dev 的前十曝光情况，每天 20:00 推送汇总
author: lin

# 在 Egern 模块设置页生成图形化表单，无需改脚本
env_schema:
  CZLAB_CODE:
    name: 兑换码
    description: "你的 6 位 Muse 兑换码，例如 WDE0F2"
  CZLAB_CODES:
    name: 多个兑换码（可选）
    description: "多个码用逗号/空格/换行分隔，例如 WDE0F2,AB12CD"
  CZLAB_BASE_URL:
    name: 站点地址
    description: 默认为 https://code.czlab.dev
    default_value: https://code.czlab.dev
  CZLAB_REPORT_HOUR:
    name: 每日推送汇总时间
    description: "每天几点推送曝光汇总（0-23，默认 20；其余整点静默只记录）"
    default_value: "20"

scriptings:
  - schedule:
      name: czlab-share
      cron: "0 * * * *"   # 每小时整点（Egern 按设备本地时区执行）
      script_url: "https://raw.githubusercontent.com/Pavel-LLL/Egern/main/egern-scripts/czlab_share.egern.js"
      timeout: 120
