# czlab 兑换码每日分享 —— Egern 模块
# 说明：兑换码仅在池中公开展示 24 小时，每天提交一次可保持持续曝光。
# Egern 的 JS 运行时与 QX/Surge 不兼容，本脚本按 Egern 官方 API
#（export default async function(ctx)，ctx.http / ctx.storage / ctx.notify）编写。

name: czlab 兑换码每日分享
description: 每小时整点记录前十曝光，每天定时把你的 Muse 兑换码提交到 code.czlab.dev 兑换池
author: lin

# 在 Egern 模块设置页生成图形化表单，无需改脚本
env_schema:
  CZLAB_CODE:
    name: 兑换码
    description: "你的 6 位 Muse 兑换码，例如 WDE0F2"
  CZLAB_CODES:
    name: 多个兑换码（可选）
    description: "多个码用逗号/空格/换行分隔，例如 WDE0F2,AB12CD"
  CZLAB_BASE_URL:
    name: 站点地址
    description: 默认为 https://code.czlab.dev
    default_value: https://code.czlab.dev
  CZLAB_REPORT_HOUR:
    name: 每日推送时间（小时）
    description: "0–23，默认 20；其余整点只静默记录前十曝光不推送"
    default_value: "20"

scriptings:
  - schedule:
      name: czlab-share
      cron: "0 * * * *"   # 每小时整点运行：静默记录前十曝光；每天 CZLAB_REPORT_HOUR 点推送汇总并做提交检查
      script_url: "https://raw.githubusercontent.com/Pavel-LLL/egern/refs/heads/main/egern-scripts/czlab_share.egern.js"
      timeout: 120
