# Emby 域名规则集 —— 走代理节点
#
# 用法：
# 1. 把本文件传到你的 GitHub 仓库（如 egern-scripts）
# 2. 在 Egern 的规则设置里添加规则集，URL 填该文件的 raw 链接
# 3. 策略选择你的代理策略组（如 Proxy / 节点选择）
#
# 说明：用完整主机名做 domain_suffix，命中自身及子域名；
# 不截短到注册域，避免误伤同一托管域名下的他人子域名。
