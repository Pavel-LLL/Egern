name: TestFlight 监控

description: 自动监控 TestFlight 名额 有名额就通知

author: iBL3ND

icon: https://iili.io/nwJtmNI.png

compat_arguments:
  tfIds: ''

compat_arguments_schema:
  tfIds:
    name: TestFlight ID
    description: 要监控的 ID，多个用逗号分隔 示例 hmC52rdF,b6X29Sva
    default_value: ''

scriptings:
  - schedule:
      name: testflight-monitor
      cron: '*/30 * * * *'
      script_url: https://raw.githubusercontent.com/Pavel-LLL/Egern/refs/heads/main/egern-scripts/TestFlight%E8%87%AA%E6%89%98%E7%AE%A1%E5%89%AF%E6%9C%AC.js
      env:
        TF: '{{{tfIds}}}'
