# 自动加入 TestFlight —— Egern 模块
#
# 来源：Loon 插件 Auto_Join_TF（作者 DecoAri / xream，KeLee 插件库）移植。
# 功能：自动监控 TestFlight 名额，一旦有新的名额即刻加入。
#
# 安装步骤：
#   1. 把 Auto_Join_TF.egern.js 和本文件一起上传到你的
#      GitHub 仓库 egern-scripts 目录（v2 改为单文件，旧的 TF_keys.egern.js、
#      Auto_join_TF.egern.js 不再需要，可从仓库删除）；
#   2. 点开本文件 → Raw → 复制地址栏 URL；
#   3. Egern → 工具 → 模块 → + → 粘贴 URL → 添加；
#   4. 确认 MITM 已开启（模块会自动添加 testflight.apple.com）；
#   5. 打开 TestFlight App 一次，收到「信息获取成功」即令牌捕获完成，
#      之后可在模块编辑页把「令牌捕获」关掉（原版也是这么用的）；
#   6. 填 APP_ID：两种方式任选——
#      a) 在模块编辑页打开「应用ID捕获」开关，然后点开任意 TF 邀请链接
#         （testflight.apple.com/join/xxxx），脚本会自动把邀请码存入 APP_ID；
#      b) 手动填：Egern → 工具 → 脚本 → 持久化数据，key 填 APP_ID，
#         value 填邀请码，多个用英文逗号分隔（如 LPQmtkUs,Hgun65jg）。
#   7. 定时脚本默认每分钟检查一次（CRON_TASK 可在模块编辑页改）。
#
# 更新日志：
#   2026-10-22 v2：v1 误用 QX/Surge 的 $persistentStore/$done 全局写法，
#   Egern 原生运行时不存在这些变量，脚本一运行就抛错并拖垮被拦截的请求
#   （表现为 TestFlight「无法加载 App」）。v2 改为 Egern 原生 ctx API 的
#   单文件脚本（抓包与定时共用同一文件、同一份 ctx.storage），且抓包全程
#   try/catch、异常也原样放行请求。另外 Egern 的 MitM 设置页没有
#   「MitM over HTTP/2」开关（那是 Loon/Surge 的），无需找它。
#   2026-10-22 初版移植。Loon 原版定时参数是 6 段式（含秒）"*/1 * * * * *"，
#   Egern cron 为 5 段式，等效改为每分钟 "* * * * *"；原版 [Rule] 段
#   （testflight.apple.com 走代理）未带入模块，如遇直连异常请在配置里
#   自行给该域名加代理规则。

name: 自动加入TestFlight
description: 自动监控TestFlight名额，一旦有新的名额即刻加入
author: DecoAri, xream（原作）/ Egern 移植
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/TestFlight.png

# 模块级参数：在 Egern「编辑模块」页可直接修改，无需改文件
compat_arguments:
  TOKEN_CAPTURE_OFF: false
  APPID_CAPTURE_OFF: true
  CRON_TASK: "* * * * *"
  CRON_TASK_TIMEOUT: 180

compat_arguments_schema:
  TOKEN_CAPTURE_OFF:
    name: "关闭令牌捕获"
    description: "抓到令牌后可打开此开关停用捕获（对应原版 CaptureAccountToken，默认关=捕获开）"
    options:
      - true
      - false
    default_value: false
  APPID_CAPTURE_OFF:
    name: "关闭应用ID捕获"
    description: "默认开（=不捕获，与原版 CaptureAppID 默认 false 一致）；想点邀请链接自动存 APP_ID 时关掉此开关"
    options:
      - true
      - false
    default_value: true
  CRON_TASK:
    name: "定时任务"
    description: "自动加入的检查频率（cron 表达式，默认每分钟）"
    default_value: "* * * * *"
  CRON_TASK_TIMEOUT:
    name: "定时任务超时时间"
    description: "单位秒，默认 180（与原版一致）"
    default_value: 180

scriptings:
  - http_request:
      name: "获取账号令牌"
      match: "^https?:\\/\\/testflight\\.apple\\.com\\/v3\\/accounts\\/.*\\/apps$"
      script_url: "https://raw.githubusercontent.com/Pavel-LLL/Egern/main/egern-scripts/Auto_Join_TF.egern.js"
      timeout: 10
      disabled: {{{TOKEN_CAPTURE_OFF}}}

  - http_request:
      name: "应用ID捕获"
      match: "^https://testflight.apple.com/join/(.*)"
      script_url: "https://raw.githubusercontent.com/Pavel-LLL/Egern/main/egern-scripts/Auto_Join_TF.egern.js"
      timeout: 10
      disabled: {{{APPID_CAPTURE_OFF}}}

  - schedule:
      name: "自动加入TF"
      cron: "{{{CRON_TASK}}}"
      script_url: "https://raw.githubusercontent.com/Pavel-LLL/Egern/main/egern-scripts/Auto_join_TF.egern.js"
      timeout: {{{CRON_TASK_TIMEOUT}}}

mitm:
  hostnames:
    includes:
      - "testflight.apple.com"
